name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Check tag matches the package version
        run: node scripts/check-release-version.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, loader, unwrap and boundary suites
        run: npm test

      - name: Install chrome-headless-shell
        id: chrome
        run: |
          INSTALLED="$(npx --yes @puppeteer/browsers install chrome-headless-shell@131.0.6778.264 --path /tmp/chrome | awk '{print $NF}' | tail -n 1)"
          if [ -x "$INSTALLED" ]; then
            CHROME_SHELL="$INSTALLED"
          else
            CHROME_SHELL="$(find "$INSTALLED" -type f -name chrome-headless-shell | head -n 1)"
          fi
          test -n "$CHROME_SHELL"
          test -x "$CHROME_SHELL"
          echo "path=$CHROME_SHELL" >> "$GITHUB_OUTPUT"
          echo "chrome-headless-shell: $CHROME_SHELL"

      - name: Packed consumer test
        run: npm run test:consumer
        env:
          CHROME_SHELL_PATH: ${{ steps.chrome.outputs.path }}

      - name: Tarball layout test
        run: npm run test:pack

      - name: Headless bake test
        run: npm run test:headless
        env:
          CHROME_SHELL_PATH: ${{ steps.chrome.outputs.path }}

      # Trusted publishing through GitHub OIDC is the default. If the npm
      # account still requires a token, add an NPM_TOKEN secret; this step then
      # publishes with it while keeping the same gates.
      - name: Publish to npm with OIDC provenance
        if: env.NPM_TOKEN == ''
        run: npm publish --provenance --access public

      - name: Publish to npm with NPM_TOKEN
        if: env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
